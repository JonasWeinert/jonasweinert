entries:
  - title: Consultant, Impact Analytics (Generative AI)
    organization: World Bank Group
    start_month: June
    start_year: 2026
    end_month: null
    end_year: Present
    location: Washington, DC (hybrid, part-time)
    details:
      - Built 5 generative-AI (LLM) tools and workflows for research, operations and monitoring teams, now used weekly. One drafting workflow lets teams produce a first draft of a policy brief or research paper in hours instead of weeks.
      - Trained 100+ staff across 12 units on using AI in research and operations work.
      - Write an internal newsletter and upskilling guide on AI literacy, read by hundreds of World Bank staff.
      - Work with individuals and teams to rework their workflows so AI is built in from the start.

  - title: "Course Content Designer & Head Tutor, The Agentic AI-Powered Professional: Reimagining Your Work"
    organization: LSE online executive education, convened by Jon Cardoso-Silva and Youngjin Yoo
    start_month: null
    start_year: 2026
    end_month: null
    end_year: Present
    location: London, UK
    details:
      - Designing 6 modules and 22 hands-on activities and assessments that teach working professionals to use Claude Code and customise agent harnesses in their own work.
      - Write the learner-facing materials and advise on scripts for 20+ course videos.
      - Head tutor from launch in Q1 2027, with 65+ learners per cohort; coordinate 4+ tutors across 20+ live sessions.

  - title: Research Consultant & Co-PI
    organization: World Bank Group, Development Economics Research Group (DECRG)
    start_month: September
    start_year: 2024
    end_month: null
    end_year: Present
    location: Remote (part-time)
    details:
      - Co-designed, built and evaluated MetaScreener, an open-source LLM tool that screens papers and extracts data for systematic reviews. It reached 94% recall against human reviewers on 700 abstracts and cut screening from months and tens of thousands of dollars in research-assistant costs to two weeks with at most one assistant.
      - Co-PI on a retrospective impact evaluation of pay-for-performance health financing in Afghanistan, 2001–2025, using quasi-experimental econometrics and data envelopment analysis across 34 provinces and 4 financing modalities.
      - Co-authored a review of AI interventions supporting frontline health workers in low-resource settings, published as a background paper for Chapter 5 of the World Development Report 2026. Co-authoring a second review on quality of care in global health interventions.

  - title: Teaching Assistant, Machine Learning & Data Science
    organization: LSE Department of Methodology & Data Science Institute
    start_month: September
    start_year: 2025
    end_month: null
    end_year: Present
    location: London, UK
    details:
      - Teach 10 seminar groups (90+ students) a year on machine learning, data science and data engineering, in Python and R.
      - Outstanding Class Teacher Award (2025), based on student feedback.

  - title: Independent Data Science & AI Consultant
    organization: Freelance
    start_month: null
    start_year: 2017
    end_month: null
    end_year: Present
    location: London, UK / remote
    details:
      - Designing an automated monitoring pipeline for data-centre equipment (cooling and other systems) that uses NLP and XGBoost on unstructured, heterogeneous monitoring data.
      - Data science, ML and software projects for NGOs and small businesses, including donor-propensity modelling for International Justice Mission and an impact-evaluation results dashboard for an international development evaluation.

  - title: Research Consultant
    organization: World Bank Group, Development Impact Evaluation (DIME)
    start_month: September
    start_year: 2023
    end_month: September
    end_year: "2024"
    location: Washington, DC
    details:
      - Ran machine-learning heterogeneity analysis (GenericML, Chernozhukov et al.) across randomised and quasi-experimental evaluations of adaptive social protection in Senegal, Burkina Faso, Mauritania and Niger, covering 500+ households.
      - Built R and Python pipelines, dashboards and reproducibility packages used by research and policy teams.

  - title: MEL Data Analyst Consultant
    organization: Itad
    start_month: September
    start_year: 2022
    end_month: January
    end_year: "2024"
    location: London, UK
    details:
      - Main point of contact between the Global Fund, WHO, Jhpiego, KIT and partners in five countries (Chad, DRC, Mali, Niger, Nigeria) for the evaluation of the Global Fund's Human Resources for Health and Quality Improvement initiative.
      - Designed survey tools in ODK and ran data collection with 50+ enumerators in four countries, covering 77 health facilities and hundreds of patients.
      - Analysed survey and health-register data with quasi-experimental methods and reported to policymakers, donors and research partners. Findings fed into the Global Fund's strategic initiative on human resources for health.

  - title: Contractor, Gender and Human Rights Branch
    organization: United Nations Population Fund (UNFPA)
    start_month: March
    start_year: 2022
    end_month: September
    end_year: "2022"
    location: New York, USA (remote)
    details:
      - Produced a 9-unit online course on gender-biased sex selection data and programme evaluation for UNFPA staff and government officials, and co-organised a research colloquium with leading academics.

  - title: Co-Founder and Chair
    organization: "NGO: Human Rights Week (Menschenrechtswoche Tübingen e.V.)"
    start_month: November
    start_year: 2017
    end_month: June
    end_year: "2020"
    location: Tübingen, Germany
    details:
      - Led 30 volunteers across 6 teams to run a week-long festival for 27 NGOs that drew more than 8,000 visitors.

  - title: Paramedic
    organization: German Red Cross
    start_month: October
    start_year: 2015
    end_month: September
    end_year: "2021"
    location: Künzelsau, Germany
    details:
      - Full-time 2015–2017 and 2021, including COVID-19 response.
