name: Build CV & site

# Builds the CV PDF and website from cv/data/*.yaml with the cv-template
# submodule, then publishes the site to the user-site repo so it is served at
# https://jonasweinert.github.io/.
# Needs a repo secret SITE_DEPLOY_TOKEN: a fine-grained PAT with
# "Contents: read and write" on JonasWeinert/jonasweinert.github.io only.

on:
  push:
    branches: [main]
    paths: ["cv/**", "cv-template", ".github/workflows/site.yml"]
  pull_request:
    paths: ["cv/**", "cv-template", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

defaults:
  run:
    working-directory: cv-template

env:
  CV_DATA: ../cv/data
  CV_OUT: ../cv/out

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            cv-template/package-lock.json
            cv-template/site/package-lock.json

      - name: Install Liberation Serif
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Install npm deps
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build PDF + site
        run: npm run build:all

      - name: Upload CV + site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-and-site
          path: cv/out

      - name: Publish to jonasweinert.github.io
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: JonasWeinert/jonasweinert.github.io
          publish_branch: main
          publish_dir: cv/out/site
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy site from JonasWeinert/jonasweinert"
